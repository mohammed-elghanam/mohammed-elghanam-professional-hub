name: Build Signed Google Play AAB

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  google-play-aab:
    name: Signed Google Play App Bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Validate required signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"

      - name: Create Android platform
        run: flutter create . --platforms=android --org=com.mohammedelghanam --project-name=mohammed_elghanam_professional_hub

      - name: Enable Android internet access
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          permission = '<uses-permission android:name="android.permission.INTERNET"/>'
          if permission not in text:
              text = text.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android">', '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    ' + permission, 1)
              manifest.write_text(text)
          PY

      - name: Restore permanent release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/mohammed-elghanam-release.jks

      - name: Configure permanent Android release signing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle.kts')
          s = p.read_text()
          android_line = 'android {'
          signing_block = 'android {\n    signingConfigs {\n        create("release") {\n            keyAlias = System.getenv("ANDROID_KEY_ALIAS")\n            keyPassword = System.getenv("ANDROID_KEY_PASSWORD")\n            storeFile = file("mohammed-elghanam-release.jks")\n            storePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")\n        }\n    }'
          if android_line not in s:
              raise SystemExit('Android block not found')
          s = s.replace(android_line, signing_block, 1)
          debug_line = 'signingConfig = signingConfigs.getByName("debug")'
          release_line = 'signingConfig = signingConfigs.getByName("release")'
          if debug_line not in s:
              raise SystemExit('Expected Flutter release signing template line not found')
          s = s.replace(debug_line, release_line, 1)
          p.write_text(s)
          PY

      - name: Verify Google Play application identity
        run: |
          grep -F 'applicationId = "com.mohammedelghanam.mohammed_elghanam_professional_hub"' android/app/build.gradle.kts
          grep -F '<uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml
          grep -F 'create("release") {' android/app/build.gradle.kts
          grep -F 'signingConfig = signingConfigs.getByName("release")' android/app/build.gradle.kts
          grep -F 'version: 4.0.0+7' pubspec.yaml

      - name: Remove generated template test
        run: rm -f test/widget_test.dart

      - name: Get packages
        run: flutter pub get

      - name: Analyze application code
        run: flutter analyze lib --no-fatal-warnings

      - name: Build signed Google Play AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build appbundle --release

      - name: Verify AAB JAR signature
        run: |
          jarsigner -verify build/app/outputs/bundle/release/app-release.aab | tee ../aab-signature-verification.txt
          grep -F 'jar verified.' ../aab-signature-verification.txt

      - name: Verify permanent signing certificate
        run: |
          keytool -printcert -jarfile build/app/outputs/bundle/release/app-release.aab | tee ../aab-certificate.txt
          grep -F 'SHA256: A0:18:31:E7:ED:B2:F1:F9:95:8A:E9:EC:A5:B8:C9:DF:AF:14:AA:A2:30:E0:53:03:F2:A3:6B:E9:59:1D:21:F4' ../aab-certificate.txt

      - name: Rename Google Play bundle
        run: cp build/app/outputs/bundle/release/app-release.aab ../Mohammed_Elghanam_Professional_Hub_Google_Play.aab

      - name: Generate AAB checksum
        run: |
          cd ..
          sha256sum Mohammed_Elghanam_Professional_Hub_Google_Play.aab > Mohammed_Elghanam_Professional_Hub_Google_Play.sha256

      - name: Upload Google Play AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mohammed-Elghanam-Google-Play-AAB
          path: |
            Mohammed_Elghanam_Professional_Hub_Google_Play.aab
            Mohammed_Elghanam_Professional_Hub_Google_Play.sha256
            aab-signature-verification.txt
            aab-certificate.txt
          if-no-files-found: error

      - name: Publish Google Play AAB to stable mobile release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd ..
          gh release upload mobile-latest Mohammed_Elghanam_Professional_Hub_Google_Play.aab Mohammed_Elghanam_Professional_Hub_Google_Play.sha256 --clobber
