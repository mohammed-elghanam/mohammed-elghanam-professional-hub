name: Validate Flutter Mobile Editions

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-mobile.yml'

permissions:
  contents: read

jobs:
  android:
    name: Android Validation APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android platform
        run: flutter create . --platforms=android --org=com.mohammedelghanam --project-name=mohammed_elghanam_professional_hub

      - name: Enable Android internet access
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          permission = '<uses-permission android:name="android.permission.INTERNET"/>'
          if permission not in text:
              text = text.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android">', '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    ' + permission, 1)
              manifest.write_text(text)
          PY

      - name: Verify Android package and internet permission
        run: |
          grep -F 'applicationId = "com.mohammedelghanam.mohammed_elghanam_professional_hub"' android/app/build.gradle.kts
          grep -F '<uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml

      - name: Remove generated template test
        run: rm -f test/widget_test.dart

      - name: Get packages
        run: flutter pub get

      - name: Analyze application code
        run: flutter analyze lib --no-fatal-warnings

      - name: Build validation APK
        run: flutter build apk --release

      - name: Rename validation APK
        run: cp build/app/outputs/flutter-apk/app-release.apk ../Mohammed_Elghanam_Professional_Hub_Android_Validation.apk

      - name: Upload validation artifact only
        uses: actions/upload-artifact@v4
        with:
          name: Mohammed-Elghanam-Android-Validation-APK
          path: Mohammed_Elghanam_Professional_Hub_Android_Validation.apk
          if-no-files-found: error

  ios-validation:
    name: iOS Flutter Validation
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create iOS platform
        run: flutter create . --platforms=ios --org=com.mohammedelghanam --project-name=mohammed_elghanam_professional_hub

      - name: Get packages
        run: flutter pub get

      - name: Build iOS without code signing
        run: flutter build ios --release --no-codesign
